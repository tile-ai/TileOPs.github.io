<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="514px" preserveAspectRatio="none" style="width:657px;height:514px;background:#FFFFFF;" version="1.1" viewBox="0 0 657 514" width="657px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="27"><text fill="#4A2C8F" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="200.4372" x="224.7814" y="26.2399">How the call device is chosen</text><text fill="#4A2C8F" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="387.4241" x="131.288" y="46.5118">(workload instantiation places tensors by the same rule)</text></g><!--entity pre--><g class="entity" data-qualified-name="pre" data-source-line="29" id="ent0001"><rect fill="#F8F5FD" height="43.648" rx="2.5" ry="2.5" style="stroke:#8E6CCF;stroke-width:0.5;" width="305.5192" x="35" y="68.5438"/><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.5192" x="45" y="86.6238">A tensor declaring device: cpu stays on the CPU</text><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.0031" x="114.758" y="105.4479">and takes no part below</text></g><!--entity c1--><g class="entity" data-qualified-name="c1" data-source-line="30" id="ent0002"><rect fill="#F8F5FD" height="24.824" rx="2.5" ry="2.5" style="stroke:#8E6CCF;stroke-width:0.5;" width="230" x="73" y="147.5438"/><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.5101" x="127.745" y="165.6238">Any call-time input?</text></g><!--entity c2--><g class="entity" data-qualified-name="c2" data-source-line="31" id="ent0003"><rect fill="#F8F5FD" height="24.824" rx="2.5" ry="2.5" style="stroke:#8E6CCF;stroke-width:0.5;" width="230" x="73" y="224.0438"/><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.5872" x="102.2064" y="242.1238">device parameter not None?</text></g><!--entity c3--><g class="entity" data-qualified-name="c3" data-source-line="32" id="ent0004"><rect fill="#F8F5FD" height="24.824" rx="2.5" ry="2.5" style="stroke:#8E6CCF;stroke-width:0.5;" width="230" x="73" y="300.5438"/><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.1311" x="96.4344" y="318.6238">Any construction-time tensor?</text></g><!--entity r5--><g class="entity" data-qualified-name="r5" data-source-line="33" id="ent0005"><rect fill="#E2F6F8" height="43.648" rx="2.5" ry="2.5" style="stroke:#3AA9B8;stroke-width:0.5;" width="230" x="73" y="360.5438"/><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.8291" x="111.0854" y="378.6238">The current CUDA device;</text><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.2111" x="127.8945" y="397.4479">None without CUDA</text></g><!--entity r1--><g class="entity" data-qualified-name="r1" data-source-line="35" id="ent0006"><rect fill="#E2F6F8" height="38.824" rx="6" ry="6" style="stroke:#3AA9B8;stroke-width:0.5;" width="280" x="363" y="140.5438"/><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.3462" x="373" y="165.6238">Their device; they must share one</text></g><!--entity r2--><g class="entity" data-qualified-name="r2" data-source-line="36" id="ent0007"><rect fill="#E2F6F8" height="57.648" rx="6" ry="6" style="stroke:#3AA9B8;stroke-width:0.5;" width="280" x="363" y="207.5438"/><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.3171" x="373" y="232.6238">device; a string is parsed</text><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.1191" x="373" y="251.4479">by torch.device</text></g><!--entity r3--><g class="entity" data-qualified-name="r3" data-source-line="37" id="ent0008"><rect fill="#E2F6F8" height="38.824" rx="6" ry="6" style="stroke:#3AA9B8;stroke-width:0.5;" width="280" x="363" y="293.5438"/><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.8952" x="373" y="318.6238">Their device; several must share one</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="51" id="ent0019"><path d="M6,432.5438 L6,499.0159 A0,0 0 0 0 6,499.0159 L369.8752,499.0159 A0,0 0 0 0 369.8752,499.0159 L369.8752,442.5438 L359.8752,432.5438 L192,432.5438 L188,404.7838 L184,432.5438 L6,432.5438 A0,0 0 0 0 6,432.5438" fill="#FBFAFE" style="stroke:#181818;stroke-width:0.5;"/><path d="M359.8752,432.5438 L359.8752,442.5438 L369.8752,442.5438 L359.8752,432.5438" fill="#FBFAFE" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.8522" x="12" y="452.6238">Once the call device is chosen, out and the outputs</text><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.8752" x="12" y="471.4479">are checked or allocated on it; construction-time tensors</text><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.3422" x="12" y="490.2719">are copied to it and cast to their signature dtype</text></g><!--link pre to c1--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="39" id="lnk9"><path d="M188,112.9138 C188,124.3438 188,132.8238 188,142.4338" fill="none" id="pre-to-c1" style="stroke:#6B5FA0;stroke-width:1;"/><polygon fill="#6B5FA0" points="188,147.4338,192,138.4338,188,142.4338,184,138.4338,188,147.4338" style="stroke:#6B5FA0;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link c1 to c2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="40" id="lnk10"><path d="M188,172.6738 C188,186.8538 188,204.7138 188,218.8938" fill="none" id="c1-to-c2" style="stroke:#6B5FA0;stroke-width:1;"/><polygon fill="#6B5FA0" points="188,223.8938,192,214.8938,188,218.8938,184,214.8938,188,223.8938" style="stroke:#6B5FA0;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="15.808" x="172" y="194.3638">no</text></g><!--link c2 to c3--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="41" id="lnk11"><path d="M188,249.1738 C188,263.3538 188,281.2138 188,295.3938" fill="none" id="c2-to-c3" style="stroke:#6B5FA0;stroke-width:1;"/><polygon fill="#6B5FA0" points="188,300.3938,192,291.3938,188,295.3938,184,291.3938,188,300.3938" style="stroke:#6B5FA0;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" lengthAdjust="spacing" textLength="15.808" x="172" y="270.8638">no</text></g><!--link c3 to r5--><g class="link" data-entity-1="ent0004"