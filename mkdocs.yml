site_name: TileOPs
site_url: https://tile-ai.github.io/TileOPs.github.io/
site_description: High-performance LLM operator library built on TileLang
repo_url: https://github.com/tile-ai/TileOPs
repo_name: tile-ai/TileOPs

theme:
  name: material
  palette:
    scheme: default
    primary: deep purple
    accent: teal
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Hanken Grotesk
    code: Space Mono
  features:
    # The page TOC sits in the right column, not folded into the left nav: the
    # left one is where vertical space is scarce. `navigation.indexes` needs
    # that (it is incompatible with `toc.integrate`) and buys back a row per
    # section — the section title is its own Overview page.
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Blog:
    - blog/index.md
  - User Guide:
    # In the order the index groups them: getting started, specs and ops,
    # kernels and hardware, integration and performance.
    - user-guide/index.md
    - Development Guide: user-guide/development.md
    - Reading and Writing Specs:
      - user-guide/manifest/index.md
      - Concepts: user-guide/manifest/concepts.md
      - Spec Fields: user-guide/manifest/writing.md
      - Extensions: user-guide/manifest/extensions.md
      - Calls and Validation: user-guide/manifest/calls.md
      - Examples: user-guide/manifest/examples.md
    - Adding an Op: new-op.md
    - Op Base Class:
      - user-guide/op/index.md
      - Construction and Calls: user-guide/op/lifecycle.md
      - Composite Ops: user-guide/op/composite.md
      - Call Records and Tuning: user-guide/op/records.md
      - Class Structure: user-guide/op/structure.md
    - Kernel Dispatch:
      - user-guide/dispatch/index.md
      - Adding a Kernel: user-guide/dispatch/writing.md
      - Backend Integration: user-guide/dispatch/backends.md
    - Adding a Backend: backends.md
    - Using torch.compile: torch-compile.md
    - Timing Benchmarks: timing.md
    - Writing Benchmarks: user-guide/benchmark/writing.md
  # In the Benchmarks pages' order: the pointwise transforms with the positional
  # rotation beside them, the axis reductions and the normalizations built on
  # them, the windowed kernels, the matmul and the quantization around it, then
  # attention, the expert routing after it and sampling at the end of a decode
  # step, then the sequence-mixing kernels. The pages Benchmarks folds into Other
  # follow: FFT, mHC and Engram. Top-k shares the Sampling page, though its op is
  # exported from `tileops.attention` and its benchmark sits on Attention. Pages are not one per family. The FP8
  # lightning indexer is a section of the Attention page, where its single op is
  # used, and the sequence-modeling family is two pages, mHC and Engram, being two
  # unrelated algorithms. Trace comes last — a tool rather than an op.
  - API Reference:
    - api/index.md
    - Elementwise: api/elementwise.md
    - RoPE: api/rope.md
    - Reduction: api/reduction.md
    - Normalization: api/normalization.md
    - Pooling: api/pool.md
    - Convolution: api/convolution.md
    - GEMM: api/linear-algebra.md
    - Quantization & Dequantization: api/quantization.md
    - Attention: api/attention.md
    - MoE: api/moe.md
    - Top-k & Sampling: api/sampling.md
    - Linear Attention: api/linear-attention.md
    - Mamba: api/mamba.md
    - FFT: api/fft.md
    - Transform: api/transform.md
    - mHC: api/mhc.md
    - Engram: api/engram.md
    - Trace: api/trace.md
  - Benchmarks:
    - benchmarks/index.md
  - Performance Guides:
    - performance-guides/index.md
    - Timeline Trace: performance-guides/trace-timeline.md
    - Memory-Bound Kernels:
      - performance-guides/memory-bound/index.md
      - Global Memory Access: performance-guides/memory-bound/global-memory-access.md
      - Shared Memory Access: performance-guides/memory-bound/shared-memory-access.md
  # In the order the index groups them: the system's structure, the spec, building
  # an op against it, then how an op is accepted.
  - Design:
    - design/index.md
    - Architecture: design/architecture.md
    - Layer Boundaries: design/layer-boundaries.md
    - Manifest: design/manifest.md
    - Op Interfaces: design/ops-design.md
    - Op Interface Reference: design/ops-design-reference.md
    - Slot Rules: design/op-slot-rules.md
    - Testing: design/testing.md
    - Roofline: design/roofline.md

markdown_extensions:
  # Docstrings and design docs carry formulas. `generic: true` emits the plain
  # \(…\) / \[…\] MathJax reads, rather than markup tied to one renderer.
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 4, so a method under a class reaches the right-hand column.
      toc_depth: 4

extra_css:
  - assets/extra.css

# MathJax itself is the only script the site pulls from a CDN; the config beside
# it re-typesets on Material's instant-loading page swaps.
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

hooks:
  - hooks.py

# mkdocs watches the docs tree and this file, but the API pages are built from
# Python source that lives outside both. Without this, a docstring edit does not
# reach `mkdocs serve` until the server restarts. Serve-only; `build` ignores it.
watch:
  - TileOPs/src/tileops

plugins:
  - search
  # Chinese pages are `<name>.zh.md` next to the English `<name>.md`. A page with
  # no Chinese version falls back to English, so the zh nav is never sparse;
  # hooks.py marks those pages with a notice. i18n runs at event_priority(-100),
  # after hooks.py has expanded the Benchmarks nav.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Blog: 博客
            Design: 设计文档
            User Guide: 用户指南
            Development Guide: 开发指南
            Reading and Writing Specs: 读写 manifest
            Concepts: 概念
            Spec Fields: 写一个 spec
            Extensions: 扩展写法
            Calls and Validation: 调用与校验
            Examples: 示例
            Kernel Dispatch: op 如何选择 kernel
            Adding a Kernel: 如何为 op 新增 kernel
            Backend Integration: backend 如何接入
            Adding an Op: 添加新 op
            Op Base Class: Op 基类
            Construction and Calls: 构造与调用
            Composite Ops: 组合 op
            Call Records and Tuning: 调用记录与调优
            Class Structure: 类结构与实例状态
            Timing Benchmarks: benchmark 的计时方法
            Writing Benchmarks: 编写 benchmark
            Using torch.compile: 接入 torch.compile
            Adding a Backend: 接入新硬件 backend
            Architecture: 架构
            Manifest: manifest 规范
            Op Interfaces: op 接口
            Op Interface Reference: op 接口参考
            Slot Rules: Slot 规则
            Roofline: Roofline
            Testing: 测试
            Layer Boundaries: 层间边界
            Elementwise: Elementwise
            API Reference: API 参考
            Reduction: Reduction
            Normalization: Normalization
            GEMM: GEMM
            Quantization: Quantization
            Quantization & Dequantization: Quantization & Dequantization
            Attention: Attention
            RoPE: RoPE
            Convolution: Convolution
            Pooling: Pooling
            Linear Attention: Linear Attention
            Mamba: Mamba
            FFT: FFT
            mHC: mHC
            MoE: MoE
            Sampling: Sampling
            Engram: Engram
            Top-k & Sampling: Top-k & Sampling
            Trace: Trace
            Conv & Pool: Conv & Pool
            SSM: SSM
            Other: 其他
            Benchmarks: 性能数据
            Performance Guides: 性能指南
            Memory-Bound Kernels: 访存受限 kernel
            Global Memory Access: 优化 global memory 访问
            Shared Memory Access: 优化 shared memory 访问
            Timeline Trace: 时间线追踪
  - include-markdown:
      rewrite_relative_urls: false
  # `paths` needs a TileOPs checkout at ./TileOPs. Without one, mkdocstrings
  # cannot import `tileops` and every identifier fails to collect, which aborts
  # the build with or without `--strict`. The workflows clone it there; locally,
  # point ./TileOPs at a checkout (a symlink works — it is gitignored).
  - mkdocstrings:
      handlers:
        python:
          paths: [TileOPs/src]
          options:
            docstring_style: google
            show_source: false
            # Parameters and returns render as definition lists, not the
            # four-column table mkdocstrings defaults to: a table gives the
            # type and the default a column each, so an op with fourteen
            # constructor parameters becomes a grid the size of the page.
            docstring_section_style: list
            # `Optional[float]` rather than `typing.Optional[float]`.
            annotations_path: brief
            # Every op class states `Bases: Op`, which distinguishes none of
            # them from another.
            show_bases: false
            # A chip before the name says whether the symbol is a class or a
            # method, which is the one thing the dotted path does not.
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            # The signature is its own block, one parameter per line: an op with
            # fourteen constructor parameters wraps mid-name in a heading, and a
            # reader scanning for one parameter has to read the whole line to find
            # it. `line_length: 1` is what makes black break every argument out;
            # any width wide enough for two arguments packs the short ones.
            separate_signature: true
            line_length: 1
            # Most elementwise and reduction ops carry no `__init__` or `forward`
            # of their own — the family's base class does — so without this the
            # page shows their name and nothing else.
            inherited_members: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tile-ai/TileOPs

