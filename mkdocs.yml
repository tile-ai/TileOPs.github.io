site_name: TileOPs
site_url: https://tile-ai.github.io/TileOPs.github.io/
site_description: High-performance LLM operator library built on TileLang
repo_url: https://github.com/tile-ai/TileOPs
repo_name: tile-ai/TileOPs

theme:
  name: material
  palette:
    scheme: default
    primary: deep purple
    accent: teal
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Hanken Grotesk
    code: Space Mono
  features:
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Design:
    - Overview: design/index.md
    - Architecture: design/architecture.md
    - Op Manifest: design/manifest.md
    - Op Interface Design: design/ops-design.md
    - Op Interface Reference: design/ops-design-reference.md
    - Roofline: design/roofline.md
    - Testing & Benchmarking: design/testing.md
    - Trust Model: design/trust-model.md
  - Skills:
    - Overview: skills/index.md
    - Catalog: skills/catalog.md
    - align-op: skills/align-op.md
    - align-family: skills/align-family.md
    - audit-family: skills/audit-family.md
    - scaffold-op: skills/scaffold-op.md
    - implement-op: skills/implement-op.md
    - test-op: skills/test-op.md
    - bench-op: skills/bench-op.md
    - add-manifest: skills/add-manifest.md
    - fix-manifest: skills/fix-manifest.md
  - API Reference:
    - Elementwise: api/elementwise.md
    - Reduction: api/reduction.md
    - Normalization: api/normalization.md
    - GEMM: api/linear-algebra.md
    - Quantization: api/quantization.md
    - Attention: api/attention.md
    - Linear Attention: api/linear-attention.md
    - Mamba: api/mamba.md
    - FFT: api/fft.md
    - MHC: api/mhc.md
    - Top-k: api/topk.md
    - Trace: api/trace.md
  - Benchmarks:
    - benchmarks/index.md
  - Performance Guides:
    - performance-guides/index.md
    - In-Kernel Timeline Trace: performance-guides/trace-timeline.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2

extra_css:
  - assets/extra.css

hooks:
  - hooks.py

plugins:
  - search
  # Chinese pages are `<name>.zh.md` next to the English `<name>.md`. A page with
  # no Chinese version falls back to English, so the zh nav is never sparse;
  # hooks.py marks those pages with a notice. i18n runs at event_priority(-100),
  # after hooks.py has expanded the Benchmarks nav.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Design: 设计
            Overview: 概览
            Architecture: 架构
            Op Manifest: 算子清单
            Op Interface Design: 算子接口设计
            Op Interface Reference: 算子接口参考
            Roofline: Roofline
            Testing & Benchmarking: 测试与性能测量
            Trust Model: 信任模型
            Elementwise: Elementwise
            # Skills stays English: those pages are agent-facing instructions.
            API Reference: API 参考
            Reduction: Reduction
            Normalization: Normalization
            GEMM: GEMM
            Quantization: Quantization
            Attention: Attention
            Linear Attention: Linear Attention
            Mamba: Mamba
            FFT: FFT
            MHC: MHC
            Top-k: Top-k
            Trace: Trace
            Benchmarks: 性能数据
            Performance Guides: 性能指南
            In-Kernel Timeline Trace: 核内时间线追踪
  - include-markdown:
      rewrite_relative_urls: false
  # A missing ./TileOPs checkout makes every mkdocstrings identifier
  # unresolvable. That is a warning, not an error, so `mkdocs serve` still works
  # on a bare clone; `--strict` turns it into a build failure, which is what CI
  # wants.
  - mkdocstrings:
      handlers:
        python:
          paths: [TileOPs/src]
          options:
            docstring_style: google
            show_source: false

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tile-ai/TileOPs

copyright: Copyright &copy; 2026 tile-ai
