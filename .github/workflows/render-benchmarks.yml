name: Daily refresh

# Daily refresh of the whole site: the Benchmarks pages from the nightly snapshot on
# tile-ai/TileOPs' `nightly-bench` orphan branch, and every page that reads the TileOPs
# checkout — the API reference from its docstrings, the mirrored design docs — since this
# job checks that repository out fresh each run. Nothing is committed; the rendered HTML
# lives on gh-pages.
#
# 22:00 UTC is 06:00 Beijing, and the TileOPs nightly finishes before that, so the data is
# waiting at the start of the working day. GitHub queues scheduled runs, so the deploy can
# land a few minutes late; workflow_dispatch is there when it should not wait.

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Both this job and the push deploy publish gh-pages with `--force`, so the two
# share one queue: a scheduled refresh and a merge landing together would
# otherwise race, and the loser's pages would be the ones served.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: tile-ai/TileOPs
          path: TileOPs
          fetch-depth: 1
          sparse-checkout: |
            docs/design
            docs/perf
            src/tileops
            scripts/nightly_report.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements-docs.txt

      - name: Render benchmark page from nightly-bench
        run: bash scripts/render_bench.sh

      - name: Deploy site
        run: mkdocs gh-deploy --force
